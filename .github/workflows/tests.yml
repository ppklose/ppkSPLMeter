name: SPLMeter tests

# Runs the unit and processor regression tests on every push and pull request.
# Deliberately separate from build-chain.yml (main only), which signs, notarizes
# and uploads release artifacts and is too slow/expensive for feature branches.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  tests-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libgl1-mesa-dev \
            libfreetype-dev libfontconfig1-dev \
            libgtk-3-dev \
            xvfb

      - name: Cache deps (JUCE + Catch2)
        uses: actions/cache@v5.0.4
        with:
          path: |
            build/_deps
          key: juce-8.0.7-catch2-3.7.1-tests-v1-linux

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSPLMETER_TFLITE=OFF -DSPLMETER_BUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --config Release --target SPLMeterTests SPLMeterProcessorTests -- -j$(nproc)

      - name: Unit tests
        run: ./build/SPLMeterTests

      - name: Processor regression tests
        # Golden files come from macOS arm64; the default tolerance mode absorbs
        # libm/FMA differences between platforms.
        run: xvfb-run -a ./build/SPLMeterProcessorTests
